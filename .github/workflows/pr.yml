name: PR Checks

# Verifies every pull request before merge: the same quality gates as CI
# (typecheck, lint, tests, build, Vercel-output smoke) plus the real-MySQL
# end-to-end harness. Deploys are intentionally NOT run here — they belong
# to ci.yml on pushes to the default branch.
on:
  pull_request:

concurrency:
  group: pr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: check · lint · test · build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck (tsc -b)
        run: npm run check

      - name: Lint (eslint)
        run: npm run lint

      - name: Tests (vitest)
        run: npm test

      - name: Build (vite + esbuild API bundle)
        run: npm run build

      - name: Build Vercel output + smoke-test the serverless function
        run: |
          npm run build:vercel
          node scripts/vercel-smoke.mjs

      - name: Smoke-test the production bundle
        run: |
          node --input-type=module -e "
            const { default: app } = await import('./dist/boot.js');
            const res = await app.fetch(new Request('http://localhost:3000/api/health'));
            const body = await res.json();
            console.log('smoke: /api/health ' + res.status + ' mode=' + body.mode);
            if (res.status !== 200) process.exit(1);
          "

      - name: Clean-tree check (pipeline leaves nothing uncommitted)
        run: |
          DIRTY=$(git status --porcelain)
          if [ -n "$DIRTY" ]; then
            echo "::error title=Dirty working tree::the pipeline generated or modified files that are not committed"
            echo "$DIRTY"
            exit 1
          fi
          echo "✅ Working tree is clean after the full pipeline."

  security:
    name: Dependency audit · secret scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Dependency audit (fail on high/critical)
        run: npm audit --audit-level=high

      - name: Secret scan (tracked files)
        run: |
          MATCHES=$(git grep -n -I -E '(ghp_[A-Za-z0-9]{36}|github_pat_[A-Za-z0-9_]{20,}|sk-[A-Za-z0-9]{20,}|AKIA[0-9A-Z]{16}|xox[baprs]-[A-Za-z0-9-]{10,}|AIza[0-9A-Za-z_-]{35}|re_[A-Za-z0-9]{20,})' -- . ':!package-lock.json' ':!docs/screenshots/**' ':!skills/**' || true)
          if [ -n "$MATCHES" ]; then
            echo "::error title=Potential secret in tracked files::$MATCHES"
            echo "$MATCHES"
            exit 1
          fi
          echo "✅ No known credential patterns in tracked files."

  mysql-e2e:
    name: Real-MySQL end-to-end (migrate → register → seed → webhook → persist)
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: app
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Prefer the persistent hosted database (TiDB Cloud / Aiven free
      # tier) when the MYSQL_E2E_URL secret is configured — the e2e then
      # runs against the same real storage the preview and production use.
      # Without the secret it falls back to the ephemeral mysql:8.4 service
      # container above, so PR checks stay green out of the box.
      - name: Run real-MySQL end-to-end harness
        env:
          MYSQL_E2E_URL: ${{ secrets.MYSQL_E2E_URL }}
        run: |
          if [ -n "$MYSQL_E2E_URL" ]; then
            echo "### Storage: persistent MySQL (MYSQL_E2E_URL secret)" >> "$GITHUB_STEP_SUMMARY"
            echo "e2e ran against the hosted TiDB/Aiven database configured in the MYSQL_E2E_URL secret." >> "$GITHUB_STEP_SUMMARY"
            npm run db:e2e
          else
            echo "### Storage: ephemeral mysql:8.4 service container (fallback)" >> "$GITHUB_STEP_SUMMARY"
            echo "Set the **MYSQL_E2E_URL** Actions secret (TiDB Cloud / Aiven free tier) to run PR checks against a persistent database." >> "$GITHUB_STEP_SUMMARY"
            MYSQL_E2E_URL="mysql://root:root@127.0.0.1:3306/app" npm run db:e2e
          fi
