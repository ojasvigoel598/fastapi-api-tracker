name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: check · lint · test · build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck (tsc -b)
        run: npm run check

      - name: Lint (eslint)
        run: npm run lint

      - name: Tests (vitest)
        run: npm test

      - name: Build (vite + esbuild API bundle)
        run: npm run build

      - name: Verify production bundle boots
        run: |
          # Boot the production bundle in demo mode to prove `npm start` is runnable.
          DEMO_MODE=true APP_SECRET="${{ secrets.APP_SECRET }}" timeout 10 node dist/boot.js &
          PID=$!
          sleep 3
          curl -fsS --max-time 5 http://localhost:3000/api/health || { kill $PID 2>/dev/null; exit 1; }
          kill $PID 2>/dev/null || true
