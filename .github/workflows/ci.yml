name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: check · lint · test · build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck (tsc -b)
        run: npm run check

      - name: Lint (eslint)
        run: npm run lint

      - name: Tests (vitest)
        run: npm test

      - name: Build (vite + esbuild API bundle)
        run: npm run build

      - name: Build Vercel output + smoke-test the serverless function
        run: |
          npm run build:vercel
          node scripts/vercel-smoke.mjs

      - name: Smoke-test the production bundle
        run: |
          # Import the built bundle and exercise it in-process (no server
          # process, no database): boot.ts only calls serve() under
          # NODE_ENV=production, which would require a real DATABASE_URL.
          node --input-type=module -e "
            const { default: app } = await import('./dist/boot.js');
            const res = await app.fetch(new Request('http://localhost:3000/api/health'));
            const body = await res.json();
            console.log('smoke: /api/health ' + res.status + ' mode=' + body.mode);
            if (res.status !== 200) process.exit(1);
          "

  # Real-MySQL end-to-end: applies the Drizzle migrations against a genuine
  # MySQL 8 server, then boots the app on DATABASE_URL and drives it through
  # the exact @trpc/client stack the frontend uses (register → seed → overview
  # percentiles → webhook key → ingest → verify rows persisted). Catches bugs
  # the demo-store unit tests cannot, e.g. SQL that only runs in MySQL mode.
  mysql-e2e:
    name: Real-MySQL end-to-end (migrate → register → seed → webhook → persist)
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: app
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run real-MySQL end-to-end harness
        run: MYSQL_E2E_URL="mysql://root:root@127.0.0.1:3306/app" npm run db:e2e

  # Build the production image and publish it to GHCR on every push to
  # main. This is also the live build of the Dockerfile — if the multi-stage
  # Dockerfile breaks, the deploy job fails even before any hosting is wired.
  deploy:
    name: Build & push Docker image to GHCR
    runs-on: ubuntu-latest
    needs: quality
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Trigger an actual redeploy on your hosting platform. Enable when you
      # have a deploy target: create a DEPLOY_HOOK_URL secret (Render/Railway/
      # Fly webhook or your own API) and uncomment this step.
      # - name: Trigger platform redeploy
      #   run: curl -fsS -X POST "${{ secrets.DEPLOY_HOOK_URL }}"

  # Deploy to Vercel on every push to main. Follows Vercel's documented
  # three-command pattern: `vercel pull` -> `vercel build --prod` (builds on
  # this runner, producing .vercel/output) -> `vercel deploy --prebuilt --prod`
  # (uploads the artifact; Vercel does NOT rebuild). The project's build
  # command (vercel.json) is `npm run build:vercel`, so the same serverless
  # output CI already smoke-tests is what ships. Gated on the quality job.
  #
  # NOTE: `secrets` cannot be referenced in a job-level `if:` expression
  # ("Unrecognized named-value: 'secrets'"). The secrets are hoisted into the
  # job `env` instead, and every deploy step is gated on `if: env.VERCEL_TOKEN
  # != ''` (env context IS allowed in step conditions) — so until the
  # VERCEL_TOKEN / VERCEL_ORG_ID / VERCEL_PROJECT_ID secrets are configured
  # the job is a no-op that stays green.
  deploy-vercel:
    name: Deploy to Vercel (production)
    runs-on: ubuntu-latest
    needs: quality
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      statuses: write
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      # Fail loudly when the deploy is not wired up. A green "Deploy to
      # Vercel" check must never be mistaken for a live deployment, so if the
      # secrets are missing the job FAILS with a clear message naming exactly
      # what to configure — the failure is the signal, not a silent green.
      - name: Verify deploy prerequisites
        run: |
          MISSING=""
          [ -z "$VERCEL_TOKEN" ] && MISSING="$MISSING VERCEL_TOKEN"
          [ -z "$VERCEL_ORG_ID" ] && MISSING="$MISSING VERCEL_ORG_ID"
          [ -z "$VERCEL_PROJECT_ID" ] && MISSING="$MISSING VERCEL_PROJECT_ID"
          if [ -z "$MISSING" ]; then
            echo "✅ Vercel deploy ENABLED — this push deploys to production."
            echo "### ✅ Vercel deploy enabled" >> "$GITHUB_STEP_SUMMARY"
            echo "This push deploys to production. The live URL is reported as a commit status." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::error title=Vercel deploy FAILED — not configured::missing secrets:$MISSING — add them in Settings → Secrets and variables → Actions, then push again"
            echo "### ❌ Vercel deploy FAILED — not configured" >> "$GITHUB_STEP_SUMMARY"
            echo "This job **fails on purpose**: the deploy is not wired up, and a green check must never fake a deployment. Configure these secrets:" >> "$GITHUB_STEP_SUMMARY"
            for s in $MISSING; do echo "- \`$s\`" >> "$GITHUB_STEP_SUMMARY"; done
            echo "Add them in **Settings → Secrets and variables → Actions**, then push again to trigger a real deploy." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        if: env.VERCEL_TOKEN != ''
        run: npm ci

      - name: Install Vercel CLI
        if: env.VERCEL_TOKEN != ''
        run: npm install --global vercel@latest

      - name: Pull Vercel Environment Information
        if: env.VERCEL_TOKEN != ''
        run: vercel pull --yes --environment=production --token=${{ env.VERCEL_TOKEN }}

      - name: Build Project Artifacts
        if: env.VERCEL_TOKEN != ''
        run: vercel build --prod --token=${{ env.VERCEL_TOKEN }}
        env:
          # Builds run on this runner, so system env vars from Vercel are NOT
          # available here — pass the DB through explicitly when configured so
          # the auto-migrate step in scripts/vercel-build.mjs can run.
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DEMO_MODE: ${{ secrets.DEMO_MODE }}

      - name: Deploy Project Artifacts to Vercel
        if: env.VERCEL_TOKEN != ''
        id: deploy
        run: |
          DEPLOY_OUTPUT=$(vercel deploy --prebuilt --prod --token=${{ env.VERCEL_TOKEN }})
          echo "$DEPLOY_OUTPUT"
          # The CLI prints the deployment URL on its own line.
          DEPLOY_URL=$(echo "$DEPLOY_OUTPUT" | grep -oE 'https://[a-z0-9-]+\.vercel\.app' | head -1)
          echo "deploy_url=$DEPLOY_URL" >> "$GITHUB_OUTPUT"
          echo "deploy_url=$DEPLOY_URL" >> "$GITHUB_STEP_SUMMARY"
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DEMO_MODE: ${{ secrets.DEMO_MODE }}
          APP_SECRET: ${{ secrets.APP_SECRET }}

      # Surface the live deployment back on GitHub: a commit status with the
      # production URL, so the deploy result is visible on the commit/PR even
      # though CLI deploys don't carry Git-provider metadata. Uses the built-in
      # GITHUB_TOKEN — no extra secrets required.
      - name: Report deployment status
        if: env.VERCEL_TOKEN != '' && steps.deploy.outputs.deploy_url != ''
        run: |
          curl -fsS -X POST \
            -H "Authorization: Bearer ${{ github.token }}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/${{ github.repository }}/statuses/${{ github.sha }} \
            -d '{"state":"success","context":"Vercel Production","description":"Deployed to Vercel","target_url":"${{ steps.deploy.outputs.deploy_url }}"}'
          echo "Reported deploy URL: ${{ steps.deploy.outputs.deploy_url }}"
